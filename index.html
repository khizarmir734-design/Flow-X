<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FLOW-X PRO V4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#111;border-bottom:1px solid #222}
.left{display:flex;align-items:center;gap:8px}
.btc{width:36px;height:36px;background:#f7931a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
.avg{text-align:center}.avg small{color:#888;font-size:10px;letter-spacing:2px}.avg div{font-size:24px;font-weight:800}
.bar{display:flex;gap:6px;padding:8px;overflow-x:auto;white-space:nowrap}
.pill{background:#1a1a1a;border:1px solid #333;padding:8px 11px;border-radius:8px;font-size:12px;font-weight:700}
.tfBar{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;align-items:center}
.tf{background:#1c1c1c;border:1px solid #333;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.tf.active{background:#fff;color:#000}
.zoomBtn{background:#f7931a;color:#000;border:none;padding:6px 12px;border-radius:20px;font-weight:900;font-size:14px}
.main{display:flex;margin:0 10px;background:#000;border:1px solid #222;border-radius:8px;overflow:hidden}
.tools{width:48px;background:#111;border-right:1px solid #222;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:4px}
.tbtn{width:38px;height:38px;background:transparent;border:1px solid transparent;border-radius:8px;color:#ccc;font-size:18px;display:flex;align-items:center;justify-content:center}
.tbtn.active{background:#2a2a2a;border-color:#f7931a;color:#f7931a}
.chartWrap{flex:1;position:relative;min-width:0}
.info{font-size:11px;color:#aaa;padding:6px;display:flex;flex-wrap:wrap;gap:8px}
.red{color:#ff4d4d}.green{color:#2ebd85}
canvas{width:100%;height:300px;display:block;touch-action:none}
#cvdCanvas{height:70px;border-top:1px dashed #333}
.priceTag{position:absolute;right:0;top:140px;background:#ff3b30;padding:4px 7px;border-radius:3px;font-weight:800;font-size:13px}
.hint{text-align:center;font-size:11px;color:#888;padding:5px}
.zoomBar{display:flex;gap:8px;justify-content:center;padding:6px}
.zb{background:#1c1c1c;border:1px solid #333;color:#fff;padding:7px 14px;border-radius:8px;font-weight:800}
.tradesHead{display:flex;justify-content:space-between;padding:12px;align-items:center}
.cols{display:flex;overflow-x:auto;border-top:1px solid #222}
.col{min-width:150px;border-right:1px solid #222;padding:8px 5px;flex:1}
.colHead{font-size:10px;color:#888;margin-bottom:6px}.colHead b{color:#fff;font-size:12px}
.row{display:flex;align-items:center;gap:5px;padding:6px 0;border-bottom:1px solid #111;font-size:12px}
.dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px}
.binance{background:#f0b90b;color:#000}.okx{background:#000;color:#fff;border:1px solid #333}.bybit{background:#f7a600;color:#000}.coinbase{background:#0052ff}.kraken{background:#5741d9}.kucoin{background:#24ae8f}.bitget{background:#00f0ff;color:#000}
.amt{margin-left:auto;color:#888;font-size:11px}
.recent{margin:10px;background:#111;border:1px solid #222;border-radius:8px;padding:10px}
.recent b{letter-spacing:2px;color:#f7931a}
.recRow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222;font-size:12px}
.clearBtn{width:calc(100% - 20px);background:#ff3b30;border:none;color:#fff;padding:8px;border-radius:6px;font-weight:800;margin:8px 10px}
</style>
</head>
<body>
<div class="top"><div class="left"><div class="btc">₿</div><b>BTC</b></div><div class="avg"><small>AVERAGE PRICE</small><div id="avgPrice">59,272.2</div></div><div style="font-size:20px">⚙️</div></div>
<div class="bar"><span class="pill">BTCUSDT</span><span class="pill">4H ▼</span><span class="pill">AUTO</span><span class="pill">LOG</span><span class="pill">⇅ FLIP</span><span class="pill">☰</span></div>
<div class="tfBar"><button class="tf" onclick="setTF(this,'1m')">1m</button><button class="tf" onclick="setTF(this,'5m')">5m</button><button class="tf" onclick="setTF(this,'15m')">15m</button><button class="tf" onclick="setTF(this,'1H')">1H</button><button class="tf active" onclick="setTF(this,'4H')">4H</button><button class="tf" onclick="setTF(this,'1D')">1D</button><button class="tf" onclick="setTF(this,'1W')">1W</button><button class="zoomBtn" onclick="zoomOut()">- ZOOM OUT</button><button class="zoomBtn" onclick="zoomIn()">+ ZOOM IN</button></div>
<div class="main"><div class="tools"><button class="tbtn active" onclick="setTool(this,'cursor')">↖️</button><button class="tbtn" onclick="setTool(this,'line')">╱</button><button class="tbtn" onclick="setTool(this,'hline')">—</button><button class="tbtn" onclick="setTool(this,'rect')">▭</button><button class="tbtn" onclick="setTool(this,'fib')">〰️</button><button class="tbtn" onclick="setTool(this,'text')">T</button><button class="tbtn" onclick="clearDraw()">🧹</button></div><div class="chartWrap"><div class="info"><span>O <span id="oP">59,798.9</span></span><span>H <span id="hP">59,805.0</span></span><span>L <span id="lP">58,923.6</span></span><span>C <span id="cP">59,272.2</span></span><span class="red" id="chg">-526.70 (-0.88%)</span><span>Vol <span class="red" id="vol">-192.18M</span></span><br><span>VWAP <span id="vwap">72,535.0</span></span><span>Spot CVD <span class="green" id="spotCVD">+0.55</span></span><span>Perp CVD <span class="red" id="perpCVD">-4.56</span></span><span>Perps Long <span class="green" id="longVol">$1.2M</span></span></div><canvas id="chart"></canvas><canvas id="cvdCanvas"></canvas><div class="priceTag" id="priceTag">59272.2</div></div></div>
<div class="zoomBar"><button class="zb" onclick="zoomOut()">🔍 - Zoom Out</button><button class="zb" onclick="zoomIn()">🔍 + Zoom In</button><button class="zb" onclick="resetZoom()">↺ Reset</button><span class="zb" id="zoomLabel">Candles: 45</span></div>
<div class="hint" id="hint">👆 Tool select karo, chart pe line khencho | Zoom se chart chota-bara karo</div>
<button class="clearBtn" onclick="clearDraw()">🧹 Sari Drawing Mitao</button>
